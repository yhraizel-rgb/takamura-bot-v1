<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Takamura Bot Pro</title><meta name="description" content="Console SaaS de pilotage WhatsApp"><style>:root{color-scheme:dark;--bg:#0d0d12;--surface:#171720;--surface2:#20202b;--text:#f4f2fb;--muted:#a7a3b8;--accent:#9b87f5;--green:#54d39a;--amber:#f5c76a;--red:#f17c8a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#292246 0,transparent 60%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}button,input{font:inherit}.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.side{padding:28px 18px;border-right:1px solid #ffffff12;background:#0f0f16}.brand{font-weight:750;letter-spacing:-.04em;font-size:19px;margin:0 8px 38px}.brand span{color:var(--accent)}nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--muted);padding:12px 14px;border-radius:10px;cursor:pointer;margin:3px 0}nav button.active,nav button:hover{background:#9b87f51a;color:var(--text)}.main{padding:34px 5vw 60px;max-width:1300px;width:100%}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:34px}.eyebrow{color:var(--accent);text-transform:uppercase;font-size:11px;letter-spacing:.14em;font-weight:700}.title{font-size:34px;letter-spacing:-.05em;margin:6px 0}.muted{color:var(--muted)}.status{display:flex;align-items:center;gap:8px;color:var(--green);background:#54d39a12;padding:9px 13px;border-radius:999px}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(145deg,#1b1b26,#15151d);border:1px solid #ffffff10;border-radius:14px;padding:20px;box-shadow:0 12px 35px #00000018}.metric{font-size:30px;font-weight:720;letter-spacing:-.06em;margin:10px 0 2px}.label{font-size:12px;color:var(--muted)}.section{margin-top:26px}.section h2{font-size:16px;margin:0 0 12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 8px;border-bottom:1px solid #ffffff0d}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#ffffff0c;font-size:12px}.green{color:var(--green)}.amber{color:var(--amber)}.login{max-width:380px;margin:12vh auto;padding:28px}.login input{display:block;width:100%;margin:8px 0 14px;padding:12px;background:#0d0d12;border:1px solid #ffffff20;border-radius:8px;color:var(--text)}.btn{border:0;border-radius:9px;background:var(--accent);color:#171222;padding:11px 16px;font-weight:700;cursor:pointer}.btn:active{transform:scale(.98)}.empty{color:var(--muted);padding:22px 0}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{position:static;border-right:0;border-bottom:1px solid #ffffff12;padding:16px}.brand{margin:0 0 12px}nav{display:flex;gap:6px;overflow:auto}nav button{white-space:nowrap;width:auto}.main{padding:26px 18px}.grid{grid-template-columns:repeat(2,1fr)}.top{display:block}.status{display:inline-flex;margin-top:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><div id="app"></div><script>'use strict';const app=document.querySelector('#app');let token=sessionStorage.getItem('accessToken');let csrf='';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'content-type':'application/json','authorization':token?`Bearer ${token}`:'',...(opts.method&&opts.method!=='GET'?{'x-csrf-token':csrf}:{}),...(opts.headers||{})}});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Erreur');return r.status===204?null:r.json()}async function loadCsrf(){csrf=(await api('/api/v1/csrf')).csrfToken}function renderLogin(){app.innerHTML=`<main class="login card"><div class="eyebrow">Takamura Bot Pro</div><h1>Connexion</h1><p class="muted">Console d’administration sécurisée.</p><label>Email<input id="email" type="email" autocomplete="username"></label><label>Mot de passe<input id="password" type="password" autocomplete="current-password"></label><button class="btn" id="login">Se connecter</button><p id="error" class="muted" aria-live="polite"></p></main>`;document.querySelector('#login').onclick=async()=>{try{const d=await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});token=d.accessToken;sessionStorage.setItem('accessToken',token);await loadCsrf();renderDash()}catch(e){document.querySelector('#error').textContent='Identifiants invalides ou serveur indisponible.'}}}async function renderDash(){app.innerHTML=`<div class="shell"><aside class="side"><div class="brand">Takamura <span>Bot Pro</span></div><nav><button class="active" data-view="overview">Vue d’ensemble</button><button data-view="sessions">Sessions</button><button data-view="commands">Commandes</button></nav></aside><main class="main"><header class="top"><div><div class="eyebrow">Control plane / production ready</div><h1 class="title">Vue d’ensemble</h1><p class="muted">Un état opérationnel lisible, sans simulation de temps réel.</p></div><div class="status"><i class="dot"></i>Service disponible</div></header><section id="content"><div class="grid" id="metrics"></div><div class="section card"><h2>Activité récente</h2><p class="empty">Aucune transition récente disponible.</p></div></section></main></div>`;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>view(b.dataset.view));await view('overview')}async function view(name){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));try{if(name==='overview'){const d=await api('/api/v1/stats');document.querySelector('#content').innerHTML=`<div class="grid">${[['Bots actifs',d.data.bots],['Sessions connectées',d.data.connected],['Commandes',d.data.commands],['Utilisateurs',d.data.users]].map(x=>`<article class="card"><div class="label">${x[0]}</div><div class="metric">${esc(x[1])}</div><div class="label">Donnée autorisée</div></article>`).join('')}</div><div class="section card"><h2>État serveur</h2><p class="green">API prête · files bornées · métriques détaillées disponibles côté opérateur.</p></div>`}if(name==='sessions'){const d=await api('/api/v1/sessions');document.querySelector('#content').innerHTML=`<div class="card"><h2>Sessions WhatsApp</h2><table class="table"><thead><tr><th>Identifiant</th><th>Numéro</th><th>État observé</th><th>Volonté</th></tr></thead><tbody>${d.data.length?d.data.map(s=>`<tr><td>${esc(s.id.slice(0,8))}</td><td>${esc(s.phoneNumber)}</td><td><span class="pill">${esc(s.state)}</span></td><td>${esc(s.desired)}</td></tr>`).join(''):`<tr><td colspan="4" class="empty">Aucune session. Le pairage se crée via POST authentifié.</td></tr>`}</tbody></table></div>`}if(name==='commands'){const d=await api('/api/v1/commands');document.querySelector('#content').innerHTML=`<div class="card"><h2>Registre de commandes · ${d.data.length}</h2><table class="table"><thead><tr><th>Commande</th><th>Catégorie</th><th>Risque</th><th>Statut</th></tr></thead><tbody>${d.data.map(c=>`<tr><td><b>.${esc(c.name)}</b><br><span class="muted">${esc(c.description)}</span></td><td>${esc(c.category)}</td><td class="${c.risk==='critical'?'amber':''}">${esc(c.risk)}</td><td>${c.enabled?'Activée':'Protégée par défaut'}</td></tr>`).join('')}</tbody></table></div>`}}catch(e){document.querySelector('#content').innerHTML='<div class="card"><p class="empty">Données indisponibles ou autorisation insuffisante.</p></div>'}}loadCsrf().catch(()=>{});if(token)renderDash().catch(renderLogin);else renderLogin();</script></body></html>
